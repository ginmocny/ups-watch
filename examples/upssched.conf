# The page only displays this timer. Shutdown belongs to upsmon, not ups-watch.
CMDSCRIPT /usr/local/sbin/nut-upssched-cmd
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock
AT ONBATT * START-TIMER fsd-onbatt 3600
AT LOWBATT * CANCEL-TIMER fsd-onbatt
AT LOWBATT * EXECUTE fsd-lowbatt
AT ONLINE * CANCEL-TIMER fsd-onbatt
